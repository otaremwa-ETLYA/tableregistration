name: tableregistration
description: "A Table fellowship registration app for row-based attendance submission"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2        # Must match firebase_database 11.x
  firebase_database: ^11.3.10   # Latest compatible Realtime Database
  http: ^1.1.0       # <- Added HTTP package for Apps Script calls
  shared_preferences: ^2.2.2   
  url_launcher: ^6.2.5        

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - lib/assets/bgd_image.jpg
    - lib/assets/SUBMIT.png
    - lib/assets/UNSUBMIT.png